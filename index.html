<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Hướng dẫn Flydigi Vader 5 Pro, Space Station, reWASD, gyro, macro, layer và troubleshooting bằng tiếng Việt.">
  <meta name="theme-color" content="#101826">
  <meta property="og:title" content="Flydigi Vader 5 Pro Guide">
  <meta property="og:description" content="Bộ tài liệu tiếng Việt về Flydigi Space Station, reWASD và cấu hình Vader 5 Pro.">
  <title>Flydigi Vader 5 Pro Guide</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Đổi giao diện">◐</button>
  <div id="app">Đang tải tài liệu…</div>
  <script>
    window.$docsify = {
      name: 'Vader 5 Pro Guide',
      repo: 'iamrealBi/flydigi-vader5-pro-guide',
      loadSidebar: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      homepage: 'README.md',
      search: { placeholder: 'Tìm trong tài liệu…', noData: 'Không tìm thấy', depth: 4 },
      copyCode: { buttonText: 'Copy', errorText: 'Lỗi', successText: 'Đã copy' },
      pagination: { previousText: '← Trước', nextText: 'Tiếp →', crossChapter: true },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' }
    };
  </script>  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script>
    const root = document.documentElement;
    const saved = localStorage.getItem('flydigi-theme');
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) root.dataset.theme = 'dark';
    document.getElementById('themeToggle').onclick = () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('flydigi-theme', root.dataset.theme);
    };
  </script>
</body>
</html>
